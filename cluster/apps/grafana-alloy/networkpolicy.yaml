---
# Default-deny all ingress in grafana-alloy. Previously this namespace had only
# the (broken, no-op) receiver policy below and therefore accepted ingress from
# every pod in the cluster. The rules below restore that to: free intra-namespace
# traffic (the collectors scrape and cluster among themselves) plus the one
# legitimate cross-namespace path — motorinfo pushing OTLP to the receiver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: grafana-alloy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The monitoring stack is a dense intra-namespace mesh: alloy-metrics scrapes
# kube-state-metrics / node-exporter / kepler / opencost, the alloy collectors
# cluster with each other on 12345, etc. Allow all ingress that originates from
# within grafana-alloy itself so none of that internal wiring breaks; only
# cross-namespace ingress is now constrained.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: grafana-alloy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana-alloy
---
# The OTLP/Zipkin receiver accepts telemetry pushed from motorinfo (intra-namespace
# senders are already covered by allow-intra-namespace above).
#
# Selector fix: the receiver pods carry app.kubernetes.io/name=alloy-receiver
# (verified live), NOT "alloy" as the previous revision assumed — that mismatch
# selected zero pods and made the policy a silent no-op.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otlp-receiver
  namespace: grafana-alloy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-receiver
      app.kubernetes.io/instance: grafana-k8s-monitoring-alloy-receiver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: motorinfo
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 9411
