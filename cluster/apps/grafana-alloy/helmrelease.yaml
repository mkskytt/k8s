---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: grafana-alloy
spec:
  url: https://grafana.github.io/helm-charts
  interval: 10m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-k8s-monitoring
  namespace: grafana-alloy
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-monitoring
      version: ">=4.0.0, <5.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: grafana-alloy
      interval: 12h
  values:
    cluster:
      name: k8s-cluster

    destinations:
      grafanaCloudMetrics:
        type: prometheus
        url: https://prometheus-prod-39-prod-eu-north-0.grafana.net/api/prom/push
        auth:
          type: basic
          usernameKey: username
          passwordKey: grafana-token
        secret:
          create: false
          name: grafana-credentials
          namespace: grafana-alloy

      grafanaCloudLogs:
        type: loki
        url: https://logs-prod-025.grafana.net/loki/api/v1/push
        auth:
          type: basic
          usernameKey: logs-username
          passwordKey: grafana-token
        secret:
          create: false
          name: grafana-credentials
          namespace: grafana-alloy

      grafanaCloudOTLP:
        type: otlp
        url: https://otlp-gateway-prod-eu-north-0.grafana.net/otlp
        protocol: http
        auth:
          type: basic
          usernameKey: otlp-username
          passwordKey: grafana-token
        secret:
          create: false
          name: grafana-credentials
          namespace: grafana-alloy
        metrics:
          enabled: true
        logs:
          enabled: true
        traces:
          enabled: true

    clusterMetrics:
      enabled: true
      collector: alloy-metrics

    costMetrics:
      enabled: true
      collector: alloy-metrics

    clusterEvents:
      enabled: true
      collector: alloy-singleton

    podLogsViaLoki:
      enabled: true
      collector: alloy-logs

    applicationObservability:
      enabled: true
      collector: alloy-receiver
      receivers:
        otlp:
          grpc:
            enabled: true
            port: 4317
          http:
            enabled: true
            port: 4318
        zipkin:
          enabled: true
          port: 9411

    telemetryServices:
      kube-state-metrics:
        deploy: true
      opencost:
        deploy: true
      kepler:
        deploy: true
      node-exporter:
        deploy: true

    collectors:
      alloy-metrics:
        enabled: true
        presets: [clustered]
      alloy-singleton:
        enabled: true
      alloy-logs:
        enabled: true
      alloy-receiver:
        enabled: true
        alloy:
          extraPorts:
            - name: otlp-grpc
              port: 4317
              targetPort: 4317
              protocol: TCP
            - name: otlp-http
              port: 4318
              targetPort: 4318
              protocol: TCP
            - name: zipkin
              port: 9411
              targetPort: 9411
              protocol: TCP
