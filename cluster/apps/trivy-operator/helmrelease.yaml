---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: aqua
  namespace: trivy-system
spec:
  url: https://aquasecurity.github.io/helm-charts/
  interval: 10m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: trivy-operator
      version: ">=0.32.0, <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: trivy-system
      interval: 12h
  values:
    # Scan workloads cluster-wide except noisy system namespaces.
    excludeNamespaces: "kube-system,trivy-system,flux-system"
    operator:
      replicas: 1
      # Keep scan jobs lean — node-collector runs per node and config audit
      # per workload, so don't pile resources on the operator itself.
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      infraAssessmentScannerEnabled: true
      # Don't scan every replicaset history; only the live revision.
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      # SBOM generation eats CPU and isn't useful without a registry to push
      # to — disable to keep scans fast.
      sbomGenerationEnabled: false
    # The operator pod itself.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    # Trivy scanner jobs. Per-workload so they need to be small.
    trivy:
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          memory: 500Mi
      # Pull the scanner image and both vuln DBs from ghcr.io (their canonical
      # home, no Docker Hub rate limits). The chart composes each image from a
      # SEPARATE registry knob: image.registry for the scanner, dbRegistry for the
      # DB, javaDbRegistry for the Java DB — all default to mirror.gcr.io. The
      # previous config overrode only dbRepository to a full ghcr.io/... path,
      # which the mirror.gcr.io dbRegistry then prefixed into the invalid path
      # mirror.gcr.io/ghcr.io/aquasecurity/trivy-db, breaking every DB download.
      # Pin all three registries to ghcr.io with registry-relative repositories so
      # they compose to ghcr.io/aquasecurity/trivy{,-db,-java-db}.
      image:
        registry: ghcr.io
        repository: aquasecurity/trivy
      dbRegistry: ghcr.io
      dbRepository: aquasecurity/trivy-db
      javaDbRegistry: ghcr.io
      javaDbRepository: aquasecurity/trivy-java-db
