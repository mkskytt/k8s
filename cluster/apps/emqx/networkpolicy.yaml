---
# Default-deny all ingress in the namespace; each rule below opens only what it needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: emqx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# WebSocket (8083) and dashboard (18083) traffic reaches EMQX only via the
# Cloudflare tunnel pods in the cloudflare-tunnel namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-emqx-from-tunnel
  namespace: emqx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: emqx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare-tunnel
      ports:
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 18083
---
# Mria/RLOG inter-node cluster traffic + the chart's headless DNS discovery
# probe each other across pods within the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-emqx-cluster
  namespace: emqx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: emqx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: emqx
---
# Allow Alloy to scrape EMQX's Prometheus metrics endpoint (18083) for
# annotation-based autodiscovery.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: emqx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: emqx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana-alloy
      ports:
        - protocol: TCP
          port: 18083
---
# Default-deny all egress; the allow-egress policy below enumerates the only
# destinations EMQX may reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: emqx
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# EMQX is a broker — clients connect IN, and it initiates almost nothing
# outbound. It needs DNS (cluster discovery uses EMQX_CLUSTER__DISCOVERY_STRATEGY
# = dns, resolving the headless service) and intra-namespace Mria/RLOG cluster
# RPC between broker pods. No external or API-server egress. Lead with DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: emqx
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace EMQX cluster RPC (Mria/RLOG) between broker pods
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: emqx
