---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: motorinfo-db
  namespace: motorinfo
spec:
  instances: 3
  # Push scrape annotations to the postgres pods so Alloy's
  # annotationAutodiscovery feature (cluster/apps/grafana-alloy) picks up
  # the metrics endpoint that CNPG already exposes on port 9187.
  inheritedMetadata:
    annotations:
      k8s.grafana.com/scrape: "true"
      k8s.grafana.com/metrics.portName: metrics
      k8s.grafana.com/metrics.path: /metrics
      k8s.grafana.com/job: cnpg
  storage:
    storageClass: hcloud-volumes
    size: 1Gi
  bootstrap:
    initdb:
      database: motorinfo
      owner: motorinfo
      secret:
        name: motorinfo-db-role
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/region
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: motorinfo-db
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://ytt-pg-backups/motorinfo-db
      endpointURL: https://fsn1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: motorinfo-db-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: motorinfo-db-backup-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 2
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: motorinfo-db-daily
  namespace: motorinfo
spec:
  schedule: "0 0 3 * * *"  # 03:00 UTC daily
  backupOwnerReference: self
  cluster:
    name: motorinfo-db
