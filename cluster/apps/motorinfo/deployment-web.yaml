---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motorinfo-web
  namespace: motorinfo
  labels:
    app.kubernetes.io/name: motorinfo
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: motorinfo
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: motorinfo
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/mkskytt/motorinfo-web:7de15f6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Downward-API vars FIRST so later vars can interpolate them.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ApiBaseUrl
              value: http://motorinfo-api.motorinfo.svc.cluster.local
            # Pyroscope continuous profiling
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: DD_PROFILING_ENABLED
              value: "1"
            - name: DD_TRACE_ENABLED
              value: "0"
            - name: PYROSCOPE_APPLICATION_NAME
              value: motorinfo-web
            - name: PYROSCOPE_SERVER_ADDRESS
              value: https://profiles-prod-015.grafana.net
            - name: PYROSCOPE_BASIC_AUTH_USERNAME
              value: "1471605"
            - name: PYROSCOPE_LABELS
              value: pod=$(POD_NAME),namespace=motorinfo,environment=production
            - name: OTEL_SERVICE_NAME
              value: motorinfo-web
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://grafana-k8s-monitoring-alloy-receiver.grafana-alloy.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=motorinfo,service.instance.id=$(POD_NAME),deployment.environment=production,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)
            - name: Faro__Url
              value: https://faro-collector-prod-eu-north-0.grafana.net/collect/7b251fdd60e01a9a62b62c776bf6e8e9
            - name: Faro__Environment
              value: production
            - name: Faro__AppVersion
              value: "1.0.0"
          envFrom:
            - secretRef:
                name: motorinfo-db
            - secretRef:
                name: pyroscope-auth
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: motorinfo-web
  namespace: motorinfo
spec:
  selector:
    app.kubernetes.io/name: motorinfo
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
