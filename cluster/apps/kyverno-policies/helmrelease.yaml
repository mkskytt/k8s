---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno-policies
      version: ">=3.8.0, <4.0.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  values:
    podSecurityStandard: baseline
    validationFailureAction: Audit
    # Skip system + privileged-by-design namespaces — they collect noise and
    # would never be enforced anyway. grafana-alloy needs hostPath + privileged
    # for log collection; kube-system, kyverno, and flux-system run the
    # platform.
    validationFailureActionOverrides:
      all:
        - action: Audit
          namespaces:
            - kube-system
            - kyverno
            - flux-system
            - grafana-alloy
