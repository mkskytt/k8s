---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno-policies
      version: ">=3.8.0, <4.0.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: kyverno
      interval: 12h
  values:
    podSecurityStandard: baseline
    # Enforce baseline PSS by default. The override list below holds the
    # namespaces that legitimately need privileges (host mounts, host
    # namespaces) to do their job and would be blocked by Enforce.
    validationFailureAction: Enforce
    validationFailureActionOverrides:
      all:
        - action: Audit
          namespaces:
            - kube-system        # hcloud-csi-node, cluster-autoscaler, ...
            - grafana-alloy      # log collection needs hostPath + host network
            - system-upgrade     # k3s system-upgrade-controller
