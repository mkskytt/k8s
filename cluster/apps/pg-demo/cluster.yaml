apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-demo
  namespace: pg-demo
spec:
  instances: 4
  storage:
    storageClass: hcloud-volumes
    size: 1Gi
  bootstrap:
    initdb:
      database: app
      owner: app
  monitoring:
    enablePodMonitor: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/region
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          cnpg.io/cluster: pg-demo
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://ytt-pg-backups/pg-demo
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: pg-demo-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: pg-demo-backup-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
        jobs: 2
